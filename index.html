<style>
/* Layout: one narrow ledger column (phone first), sticky month header, five-tab bar, floating "記一筆" button.
   Ink-blue accent on a green-grey paper neutral; red/green are reserved for expense/income. */
:root{
  --bg:#E7EDEB; --surface:#F3F6F5; --ink:#3E5450; --muted:#697B76; --line:#D3DDDA;
  --accent:#5F8F7F; --on-accent:#FFFFFF; --accent-soft:#DCE7E3;
  --inc:#5E9680; --exp:#9C587A; --net:#5C69AD; --warn:#9A6A00; --dot-l:58%; --shadow:0 1px 2px rgba(62,84,80,.06),0 6px 18px rgba(62,84,80,.06);
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --serif:'Noto Serif TC','Songti TC',serif;
  --mono:'Noto Sans TC','PingFang TC',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141C1A; --surface:#1D2825; --ink:#E1EBE7; --muted:#96A8A2; --line:#2E3C38;
  --accent:#8DBFAE; --on-accent:#10201B; --accent-soft:#25352F;
  --inc:#86C3AB; --exp:#D58FB0; --net:#98A4E0; --warn:#E3B341; --dot-l:66%; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141C1A; --surface:#1D2825; --ink:#E1EBE7; --muted:#96A8A2; --line:#2E3C38;
  --accent:#8DBFAE; --on-accent:#10201B; --accent-soft:#25352F;
  --inc:#86C3AB; --exp:#D58FB0; --net:#98A4E0; --warn:#E3B341; --dot-l:66%; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-block:0 calc(150px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:6px}
.mrow h1{margin:0;font-size:19px;font-weight:700;flex:1;text-align:center;text-wrap:balance}
.ibtn{width:40px;height:40px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--ink)}
.ibtn:hover{background:var(--accent-soft)}
.ic{width:22px;height:22px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.sum div{min-width:0}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.sum .num{font-size:17px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis}
.exp{color:var(--exp)} .inc{color:var(--inc)}
main{padding-top:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 6px;color:var(--muted);font-size:13px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:hsl(var(--h) 42% var(--dot-l))}
.rt{flex:1;min-width:0}
.rt b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding:4px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:11.5px;color:var(--muted);border-radius:8px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;z-index:26;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));
  height:52px;padding:0 20px 0 16px;border:0;border-radius:26px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:6px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 6px;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;min-height:36px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:500}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.d{color:var(--exp);border-color:var(--exp)}
.btn.s{min-height:36px;padding:6px 12px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=date],select,input[type=search]{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.big{font-size:32px;font-weight:500;text-align:right;min-height:64px!important}
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(8,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:17px}
.shd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.over i{background:var(--exp)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0}
.cal button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:62px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;font-size:13px}
.cal button.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal button.today b{color:var(--accent)}
.cal button small{font-size:10px;line-height:1.15;font-family:var(--mono);max-width:100%;overflow:hidden}
.cal .blank{visibility:hidden}
svg.chart{width:100%;height:auto;display:block}
svg.chart .b{fill:var(--line)} svg.chart .b.cur{fill:var(--accent)}
svg.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px;text-anchor:middle}
svg.chart text.v{fill:var(--ink)}
.muted{color:var(--muted)} .sm{font-size:13px}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;max-width:30em;text-wrap:balance}
.skel{height:14px;border-radius:7px;background:var(--line);margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90%}
.save{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details>summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details>summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details[open]>summary::after{content:"–"}
details>div{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.lr{display:flex;align-items:center;gap:8px;min-width:0}
.lr>*:first-child{flex:1;min-width:0}
.lr input[type=text]{min-height:40px}
.pct{width:84px!important;text-align:right;font-family:var(--mono)}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* 文青簡約：柔和鼠尾草綠、無硬邊框、大圓角、襯線標題 */
.num,.amt{font-family:var(--sans);font-weight:300;letter-spacing:0}
.sum .num{font-weight:400}
.mrow h1,.card h2,.sheet h3{font-family:var(--serif);font-weight:700;letter-spacing:.04em}
.card,.rows,details{border:0;border-radius:20px;box-shadow:var(--shadow)}
.row{border-bottom:1px solid var(--line)}
.hdr{border-bottom:0}
.tabs{border-top:0;box-shadow:0 -6px 20px rgba(62,84,80,.07);border-radius:22px 22px 0 0}
.fab{border-radius:50%;width:56px;height:56px;padding:0;justify-content:center;font-size:0}
.fab svg{width:26px;height:26px}
.btn,.chip,input[type=text],input[type=date],select,input[type=search]{border-radius:14px;border-color:transparent;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.btn.p{background:var(--accent);box-shadow:none}
.seg{border-radius:14px;border:0;background:var(--accent-soft)}
.seg button[aria-pressed="true"]{box-shadow:var(--shadow);background:var(--surface)}
.subtabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -2px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:0;background:none;padding:10px 12px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;font-size:15px}
.subtabs button[aria-current="true"]{color:var(--accent);border-color:var(--accent);font-weight:700}
.mline{display:flex;align-items:center;gap:10px;padding:8px 0}
.mline .k{width:42px;color:var(--muted)}
.mline .cnt{min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:12px}
.mline .tr{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.mline .tr i{display:block;height:100%;border-radius:3px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.rings svg{width:100%;max-width:104px;height:auto}
.rings small{display:block;color:var(--muted)}
.ring-bg{stroke:var(--line)} 
.lr>.badge,.badge{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;background:hsl(var(--h) 34% var(--dot-l))}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag2{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted);white-space:nowrap}
.big-total{font-family:var(--sans);font-weight:300;font-size:46px;line-height:1.1;color:var(--inc);text-align:center}
.big-total.neg{color:var(--exp)}
.ghead{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:14px 2px 6px;color:var(--muted);font-size:15px}
.ghead span:first-child::before{content:"– ";}
.ghead.shut span:first-child::before{content:"+ ";}
.acrow{display:flex;align-items:center;gap:14px;padding:12px 4px;width:100%;border:0;background:none;text-align:left}
.aic{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--ink);flex:none}
.blur{filter:blur(7px);user-select:none}
.legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.lr select{width:auto;flex:0 1 54%;min-width:0}
.lr>span:first-child{flex:1 1 38%;overflow-wrap:anywhere}
textarea{width:100%;border:0;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px;font:inherit;color:inherit;resize:none;min-height:46px}
.mv{display:flex;gap:4px;flex:none}.mv .btn{min-width:38px;padding:4px 8px;min-height:34px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding:2px}
.bub{padding:9px 13px;border-radius:16px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.bub.a{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow)}
.prop{align-self:stretch;background:var(--accent-soft);border-radius:16px;padding:12px}
</style></head><body>
<div id="login" hidden></div>
<div id="app">
  <div class="hdr" id="hdr"></div>
  <main id="view"><div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:75%"></div></div></main>
  <div class="save" id="saveState"></div>
</div>
<nav class="tabs" id="tabs" aria-label="主要分頁"></nav>
<button class="fab" id="fab" data-act="add"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>記一筆</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/*CORE*/
const TYPE_IN={'支出':'e','收入':'i','轉出':'xo','轉入':'xi','餘額調整':'adj','應收款項':'rcv','手續費':'fee'};
const TYPE_OUT={e:'支出',i:'收入',xo:'轉出',xi:'轉入',adj:'餘額調整',rcv:'應收款項',fee:'手續費'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const monthOf=d=>d.slice(0,7);
const isExp=r=>r.t==='e'||r.t==='fee';
const isInc=r=>r.t==='i';
function monthAdd(m,n){const d=new Date(+m.slice(0,4),+m.slice(5)-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  if(!rows.length)return[];
  const head=rows.shift().map(h=>h.trim());
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}
function fromMoze(rows){
  const out=[];
  for(const r of rows){
    const t=TYPE_IN[r['記錄類型']];if(!t)continue;
    const a=parseFloat(String(r['金額']).replace(/,/g,''));if(!isFinite(a))continue;
    const p=(r['日期']||'').split(/[\/-]/);if(p.length!==3)continue;
    const d=p[0]+'-'+p[1].padStart(2,'0')+'-'+p[2].padStart(2,'0');
    const nm=r['名稱']&&r['名稱']!=='CATEGORY_ADJUSTMENT'?r['名稱']:'';
    out.push({t,a,c:r['主類別']||'',s:r['子類別']||'',ac:r['帳戶']||'',d,tm:r['時間']||'',n:nm||r['描述']||'',p:r['專案']||'',o:r['對象']||''});
  }
  for(let i=0;i<out.length-1;i++){
    const x=out[i],y=out[i+1];
    if(((x.t==='xo'&&y.t==='xi')||(x.t==='xi'&&y.t==='xo'))&&x.d===y.d&&x.tm===y.tm&&Math.abs(x.a+y.a)<1e-9){const g=uid();x.g=g;y.g=g;i++}
  }
  return out;
}
const recKey=r=>[r.d,r.tm,r.t,r.ac,r.a,r.c,r.s].join('|');
function mergeRecords(byMonth,incoming){
  const cnt=new Map();
  for(const m in byMonth)for(const r of byMonth[m]){const k=recKey(r);cnt.set(k,(cnt.get(k)||0)+1)}
  const seen=new Map();let added=0,skipped=0;const touched=new Set();
  for(const r of incoming){
    const k=recKey(r),n=(seen.get(k)||0)+1;seen.set(k,n);
    if(n<=(cnt.get(k)||0)){skipped++;continue}
    const m=monthOf(r.d);(byMonth[m]||(byMonth[m]=[])).push({...r,id:r.id||uid()});touched.add(m);added++;
  }
  return{added,skipped,touched};
}
function sumByAccount(byMonth){const b={};for(const m in byMonth)for(const r of byMonth[m])b[r.ac]=(b[r.ac]||0)+r.a;return b}
function monthTotals(recs){let e=0,i=0;for(const r of recs){if(isExp(r))e+=-r.a;else if(isInc(r))i+=r.a}return{e,i}}
function bucketOf(r,st){
  const R=st.ratios||{},pm=st.projectMap||{},m=st.bucketMap||{};
  const pick=b=>b&&R[b]!==undefined?b:null;
  const def=pick(st.defaultBucket)||pick('生活費帳戶')||Object.keys(R)[0];
  return (r.p&&pick(pm[r.p]))||pick(m[r.c+'/'+r.s])||pick(m[r.c])||def;
}
function salaryBase(recs,st,month){
  const o=st.baseOverride&&st.baseOverride[month];if(o!=null&&o!=='')return+o;
  return recs.filter(r=>isInc(r)&&(st.salarySubs.includes(r.s)||(st.incBonus&&r.s==='獎金'))).reduce((s,r)=>s+r.a,0);
}
function allocation(recs,st,month){
  const base=salaryBase(recs,st,month);
  const rows=Object.entries(st.ratios).map(([k,p])=>({k,p,budget:Math.round(base*p),spent:0}));
  const idx=Object.fromEntries(rows.map(r=>[r.k,r]));
  for(const r of recs)if(isExp(r)){const b=idx[bucketOf(r,st)];if(b)b.spent+=-r.a}
  return{base,rows};
}
function toMozeCSV(byMonth){
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const head=['帳戶','幣種','記錄類型','主類別','子類別','金額','手續費','折扣','名稱','商家','日期','時間','專案','描述','標籤','對象'];
  const all=[];for(const m of Object.keys(byMonth).sort())for(const r of byMonth[m])all.push(r);
  all.sort((a,b)=>(a.d+a.tm).localeCompare(b.d+b.tm));
  const lines=[head.join(',')];
  for(const r of all){
    const xf=r.t==='xo'||r.t==='xi';

function assistIssues(){

  um.forEach(p=>out.push({lvl:1,t:`專案「${p}」還沒對應到分配帳戶`,d:'沒對到的會算進預設帳戶。',fix:`<select data-apm="${esc(p)}" style="min-height:38px"><option value="">選帳戶…</option>${Object.keys(st.ratios).map(n=>`<option>${esc(n)}</option>`).join('')}</select><button class="btn s" data-act="afixpm" data-p="${esc(p)}">套用</button>`}));

    const by={};ex.filter(x=>bucketOf(x,st)===r.k).forEach(x=>{const k=x.c+(x.s?'·'+x.s:'');by[k]=(by[k]||0)-x.a});
    const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
    out.push({lvl:2,t:`「${r.k}」超支 $${fmt(r.spent-r.budget)}`,d:`預算 ${fmt(r.budget)}，已花 ${fmt(r.spent)}。`,list:top.map(([k,v])=>`${k} $${fmt(v)}`)})});

  const g={};ex.forEach(r=>{const k=[r.d,r.a,r.c,r.s,r.ac].join('|');(g[k]||(g[k]=[])).push(r)});
  const dups=Object.values(g).filter(a=>a.length>1&&!a.some(r=>String(r.id).startsWith('rc_')));
  if(dups.length){const ids=dups.flatMap(a=>a.slice(1).map(r=>r.id));out.push({lvl:2,t:`${dups.length} 組可能重複記帳`,d:'同一天、同金額、同分類、同帳戶。若是真的買了兩次，就不要刪。',list:dups.slice(0,5).map(a=>`${a[0].d.slice(5).replace('-','/')} ${a[0].c}${a[0].s?'·'+a[0].s:''} −${fmt(-a[0].a)} ×${a.length}`),fix:`<button class="btn s d" data-act="adedup" data-ids="${esc(ids.join(','))}">刪除多出來的 ${ids.length} 筆</button>`})}
  // 6 信用卡
  const bills=st.bills[m]||{};
  st.accounts.filter(a=>a.k==='card'&&!a.h).forEach(a=>{const sp=ex.filter(r=>r.ac===a.n).reduce((s,r)=>s-r.a,0),b=bills[a.n]||{};
    if(sp>0&&(b.amt==null||b.amt===''))out.push({lvl:1,t:`「${a.n}」本月刷卡 $${fmt(sp)}，還沒填帳單金額`,d:'帳單出來後到「帳戶」填入，可以對照有沒有漏記。'});
    else if(b.amt>0&&!b.paid)out.push({lvl:1,t:`「${a.n}」帳單 $${fmt(+b.amt)} 還沒標已繳`,d:'繳完記得到「帳戶」勾已繳。'})});
  // 7 異常大額
  const catAvg={};allRecs().filter(r=>r.t==='e').forEach(r=>{const o=catAvg[r.c]||(catAvg[r.c]={n:0,s:0});o.n++;o.s-=r.a});

  return out.sort((a,b)=>b.lvl-a.lvl);
}

function openAdd(rec){

function saveRec(again){
  const st=S.settings;let a=parseFloat(String(F.a).replace(/,/g,''));
  if(!isFinite(a)||a===0){toast('請輸入金額');return}
  if(F.t!=='raw')a=Math.abs(a);
  if((F.t==='e'||F.t==='i')&&!F.c){toast('請選擇分類');return}
  if(F.t==='x'&&F.ac===F.to){toast('轉出和轉入不能是同一個帳戶');return}
  if(!F.d){toast('請選擇日期');return}
  const tm=F.tm||new Date().toTimeString().slice(0,5),touched=new Set();
  const removeIds=ids=>{for(const m in S.months){const n=S.months[m].length;S.months[m]=S.months[m].filter(r=>!ids.includes(r.id));if(S.months[m].length!==n)touched.add(m)}};
  const put=r=>{const m=monthOf(r.d);(S.months[m]||(S.months[m]=[])).push(r);touched.add(m)};
  if(F.mode==='edit')removeIds(F.t==='x'?F.ids:[F.id]);
  if(F.t==='x'){const g=F.g||uid(),ids=F.ids||[uid(),uid()];
    put({id:ids[0],t:'xo',a:-a,c:'轉帳',s:'轉帳',ac:F.ac,d:F.d,tm,n:F.n,p:F.p||'',o:'',g});
    put({id:ids[1],t:'xi',a:a,c:'轉帳',s:'轉帳',ac:F.to,d:F.d,tm,n:F.n,p:F.p||'',o:'',g});
  }else if(F.t==='raw'){put({...F.orig,a,ac:F.ac,d:F.d,tm,n:F.n,p:F.p||''})}
  else put({id:F.id||uid(),t:F.t,a:F.t==='e'?-a:a,c:F.c,s:F.s,ac:F.ac,d:F.d,tm,n:F.n,p:F.p||'',o:F.o||''});
  if(F.c&&F.s){const k=F.t==='i'?'i':'e',l=st.cats[k][F.c]||(st.cats[k][F.c]=[]);if(!l.includes(F.s))l.push(F.s)}
  st.lastAcc=F.ac;commitSettings();touched.forEach(commitMonth);
  const keepT=F.t,keepAc=F.ac,keepTo=F.to,d=F.d;
  S.month=monthOf(F.d);
  if(again){F={mode:'add',t:keepT,id:'',a:'',c:'',s:'',ac:keepAc,to:keepTo,d,tm:'',n:'',p:''};drawAdd();toast('已儲存')}
  else{closeSheet();toast('已儲存')}
  render();
}
function deleteRec(){
  const ids=F.t==='x'?F.ids:[F.id];
  ids.forEach(id=>{if(String(id).startsWith('rc_')&&!S.settings.skip.includes(id))S.settings.skip.push(id)});
  const touched=new Set();
  for(const m in S.months){const n=S.months[m].length;S.months[m]=S.months[m].filter(r=>!ids.includes(r.id));if(S.months[m].length!==n)touched.add(m)}
  commitSettings();touched.forEach(commitMonth);closeSheet();render();toast('已刪除');
}

  <details><summary>每月預算（依支出分類）</summary><div>${expCats.map(c=>`<div class="lr"><span>${esc(c)}</span><input type="text" class="pct" inputmode="numeric" data-bud="${esc(c)}" value="${st.budgets[c]||''}" placeholder="不設定"></div>`).join('')}</div></details>
  <details><summary>固定收支（每月自動入帳）</summary><div>
    ${st.recurring.length?st.recurring.map(it=>`<div class="lr"><span><b>${esc(it.n)}</b><br><small class="muted">每月 ${it.day} 日 · ${it.t==='e'?'支出':'收入'} ${fmt(it.a)} · ${esc(it.ac)}${it.on?'':' · 已停用'}</small></span><button class="btn s" data-act="rtoggle" data-id="${esc(it.id)}">${it.on?'停用':'啟用'}</button><button class="btn s d" data-act="rdelx" data-id="${esc(it.id)}">刪除</button></div>`).join(''):'<div class="muted sm">還沒有固定收支，例如房租、訂閱、薪水。</div>'}
    <div class="card" style="background:var(--bg)"><div class="grid2"><label class="field"><span>名稱</span><input type="text" id="rc-n" placeholder="例如：房租"></label><label class="field"><span>金額</span><input type="text" id="rc-a" inputmode="numeric"></label>
      <label class="field"><span>類型</span><select id="rc-t"><option value="e">支出</option><option value="i">收入</option></select></label><label class="field"><span>每月幾號</span><input type="text" id="rc-d" inputmode="numeric" value="1"></label>
      <label class="field"><span>分類</span><select id="rc-c">${Object.keys(st.cats.e).map(c=>`<option>${esc(c)}</option>`).join('')}<option disabled>── 收入 ──</option>${Object.keys(st.cats.i).map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label class="field"><span>子分類</span><input type="text" id="rc-s" placeholder="例如：房租"></label></div>
      <label class="field" style="margin-top:10px"><span>帳戶</span><select id="rc-ac">${optsAcc(st.lastAcc)}</select></label>
      <button class="btn p" style="margin-top:10px;width:100%" data-act="radd2">新增固定收支</button></div></div></details>
  <details><summary>分類管理</summary><div>${['e','i'].map(k=>`<b class="sm">${k==='e'?'支出':'收入'}分類</b>${Object.entries(st.cats[k]).map(([c,ss])=>`<div class="card" style="background:var(--bg);padding:10px;margin:6px 0;box-shadow:none"><div class="lr"><b>${esc(c)}</b><span class="mv"><button class="btn s" data-act="catmv" data-k="${k}" data-c="${esc(c)}" data-d="-1" aria-label="上移">↑</button><button class="btn s" data-act="catmv" data-k="${k}" data-c="${esc(c)}" data-d="1" aria-label="下移">↓</button><button class="btn s d" data-act="catdel" data-k="${k}" data-c="${esc(c)}">刪除</button></span></div><div class="chips" style="margin-top:6px">${ss.map(x=>`<button class="chip" style="min-height:30px;font-size:13px;padding:2px 10px" data-act="subdel" data-k="${k}" data-c="${esc(c)}" data-s="${esc(x)}" aria-label="刪除子分類 ${esc(x)}">${esc(x)} ×</button>`).join('')||'<span class="muted sm">沒有子分類</span>'}</div></div>`).join('')}<div class="lr"><input type="text" data-newcat="${k}" placeholder="新增${k==='e'?'支出':'收入'}主分類"><button class="btn s" data-act="addcat" data-k="${k}">新增</button></div>`).join('')}
    <p class="muted sm" style="margin:0">點子分類可以刪除，刪除分類不會刪掉已經記的紀錄。子分類在「記一筆」時直接輸入就會新增。</p></div></details>`);
}
function download(name,data){
  const u=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('已下載 '+name)
}

/* ---------- import ---------- */
let IMP=null;
async function onImport(file){
  const info=$('#impInfo');
  try{
    const rows=parseCSV(await file.text()),inc=fromMoze(rows);
    if(!inc.length){info.textContent='讀不到可匯入的紀錄，請確認這是 MOZE 匯出的 CSV。';return}
    const copy={};for(const m in S.months)copy[m]=S.months[m].slice();
    const probe=mergeRecords(copy,inc.map(r=>({...r})));
    const dates=inc.map(r=>r.d).sort(),known=new Set(accNames()),newAcc=[...new Set(inc.map(r=>r.ac))].filter(a=>a&&!known.has(a));
    IMP={inc,newAcc};
    info.innerHTML=`<div class="card" style="background:var(--bg)">共 <b class="num">${inc.length}</b> 筆（${dates[0]} ～ ${dates[dates.length-1]}）<br>新增 <b class="num">${probe.added}</b> 筆，已存在 <b class="num">${probe.skipped}</b> 筆略過<br>${newAcc.length?'新帳戶：'+esc(newAcc.join('、')):'沒有新帳戶'}
      <button class="btn p" style="width:100%;margin-top:10px" data-act="doimp" ${probe.added?'':'disabled'}>${probe.added?'開始匯入':'沒有需要匯入的紀錄'}</button></div>`;
  }catch(e){info.textContent='讀取檔案失敗，請重新選擇。'}
}
async function doImport(btn){
  if(!S.ready){toast('帳本還沒讀取完成');return}
  btn.disabled=true;const st=S.settings,{inc,newAcc}=IMP;
  const res=mergeRecords(S.months,inc);
  newAcc.forEach(n=>st.accounts.push({n,k:'bank',init:0}));
  for(const r of inc){const k=r.t==='i'?'i':(r.t==='e'||r.t==='fee')?'e':null;if(!k||!r.c)continue;const l=st.cats[k][r.c]||(st.cats[k][r.c]=[]);if(r.s&&!l.includes(r.s))l.push(r.s)}
  commitSettings();const ms=[...res.touched].sort();ms.forEach(commitMonth);
  const total=ms.length+1;progCb=left=>{btn.textContent='寫入中… '+Math.max(0,total-left)+' / '+total};btn.textContent='寫入中…';
  await drain();progCb=null;IMP=null;
  S.month=ms.length?ms[ms.length-1]:S.month;render();
  const info=$('#impInfo');if(info)info.innerHTML=`<div class="card" style="background:var(--bg)">匯入完成，新增 ${res.added} 筆。${newAcc.length?'<br>請到「帳戶」確認各帳戶類型（信用卡請改成「信用卡」），並用「目前實際餘額」校正。':''}</div>`;
}

/* ---------- actions ---------- */
const ACTS={
  goto:t=>{S.view=t.dataset.v;if(S.view==='stock'&&S.ready&&(!S.lastSync||Date.now()-S.lastSync>18e5))setTimeout(()=>syncPrices(false),50);try{history.replaceState(null,'','#'+S.view)}catch(e){}render();scrollTo(0,0)},
  mon:t=>{S.month=monthAdd(S.month,+t.dataset.n);S.day=null;render()},
  add:()=>openAdd(),
  edit:t=>{const id=t.dataset.id;for(const it of items(monthOf(findDate(id)))){if(it.id===id){openAdd(it);return}}},
  close:()=>closeSheet(),
  bg:(t,e)=>{if(e.target===t)closeSheet()},
  day:t=>{S.day=S.day===t.dataset.d?null:t.dataset.d;render()},
  cty:t=>{S.cty=t.dataset.v;render()},
  scope:t=>{S.scope=t.dataset.v;render()},
  pickm:t=>{S.month=t.dataset.m;render()},
  srange:t=>{S.srange=+t.dataset.v;render()},
  sync:()=>syncPrices(true),
  assist:()=>openAssist(),
  atab:t=>{S.atab=t.dataset.v;openAssist()},
  rmv:t=>{syncAL();moveIdx(AL.ratios,+t.dataset.i,+t.dataset.d);drawAlloc()},
  gmv:t=>{const st=S.settings;st.groups=groupList().filter(g=>g!=='不再使用');moveIdx(st.groups,st.groups.indexOf(t.dataset.g),+t.dataset.d);commitSettings();openSettings();render()},
  catmv:t=>{const st=S.settings,k=t.dataset.k;st.cats[k]=moveKey(st.cats[k],t.dataset.c,+t.dataset.d);commitSettings();openSettings()},
  catdel:t=>{if(!t.dataset.sure){t.dataset.sure='1';t.textContent='再按一次';return}delete S.settings.cats[t.dataset.k][t.dataset.c];commitSettings();openSettings();render()},
  subdel:t=>{const l=S.settings.cats[t.dataset.k][t.dataset.c];const i=l.indexOf(t.dataset.s);if(i>=0)l.splice(i,1);commitSettings();openSettings()},
  amv:t=>{const st=S.settings,a=st.accounts.find(x=>x.n===F.acc);if(!a)return;const d=+t.dataset.d,g=grpOf(a);let i=st.accounts.indexOf(a),j=i+d;while(j>=0&&j<st.accounts.length&&(grpOf(st.accounts[j])!==g||st.accounts[j].h))j+=d;if(j<0||j>=st.accounts.length)return;[st.accounts[i],st.accounts[j]]=[st.accounts[j],st.accounts[i]];commitSettings();render();toast('已調整順序')},
  adel:t=>{const st=S.settings,n=F.acc;if(allRecs().some(r=>r.ac===n)){toast('這個帳戶已有紀錄，請改用「移到不再使用」');return}if(!t.dataset.sure){t.dataset.sure='1';t.textContent='再按一次確認刪除';return}st.accounts=st.accounts.filter(a=>a.n!==n);commitSettings();closeSheet();render();toast('已刪除')},
  csend:()=>chatSend(),
  papply:t=>proposalApply(+t.dataset.m,+t.dataset.p,true),
  pskip:t=>proposalApply(+t.dataset.m,+t.dataset.p,false),
  cclear:()=>{S.chat=[];openAssist()},
  afixproj:()=>{const v=$('#as-proj').value;if(!v){toast('請先選專案');return}const t=new Set();recs(S.month).forEach(r=>{if(r.t==='e'&&!r.p){r.p=v;t.add(S.month)}});t.forEach(commitMonth);render();openAssist();toast('已套用');},
  afixpm:t=>{const p=t.dataset.p,sel=[...document.querySelectorAll('[data-apm]')].find(x=>x.dataset.apm===p);if(!sel||!sel.value){toast('請先選帳戶');return}(S.settings.projectMap=S.settings.projectMap||{})[p]=sel.value;commitSettings();render();openAssist();toast('已套用');},
  adedup:t=>{const ids=t.dataset.ids.split(',');const touched=new Set();for(const m in S.months){const n=S.months[m].length;S.months[m]=S.months[m].filter(r=>!ids.includes(r.id));if(S.months[m].length!==n)touched.add(m)}touched.forEach(commitMonth);render();openAssist();toast('已刪除');},
  trade:()=>openTrade(),prices:()=>openPrices(),
  ttype:t=>{$('#tb').setAttribute('aria-pressed',t.dataset.v==='b');$('#ts').setAttribute('aria-pressed',t.dataset.v==='s')},
  tsave:()=>{const st=S.settings,c=$('#t-c').value.trim(),sh=parseFloat($('#t-s').value.replace(/,/g,'')),p=parseFloat($('#t-p').value.replace(/,/g,'')),d=$('#t-d').value,type=$('#tb').getAttribute('aria-pressed')==='true'?'b':'s';
    if(!c||!(sh>0)||!(p>0)||!d){toast('請填代號、股數、成交價');return}
    if(type==='s'){const h=holdingsFrom(st.trades,st.prices).find(x=>x.code===c);if(!h||h.sh<sh){toast('賣出股數超過目前持有');return}}
    (st.trades=st.trades||[]).push({id:uid(),d,code:c,name:$('#t-n').value.trim(),type,sh,p,fee:parseFloat($('#t-f').value)||0});
    st.prices=st.prices||{};if(!st.prices[c]||d>=st.prices[c].at)st.prices[c]={p,at:d};
    snapNow();commitSettings();closeSheet();render();toast('已儲存');},
  psave:()=>{const st=S.settings;document.querySelectorAll('[data-px]').forEach(i=>{const v=parseFloat(i.value);if(v>0)st.prices[i.dataset.px]={p:v,at:todayStr()}});snapNow();commitSettings();closeSheet();render();toast('已更新');},
  tdel:t=>{const st=S.settings;st.trades=st.trades.filter(x=>x.id!==t.dataset.id);snapNow();commitSettings();render()},
  rep:t=>{S.rep=t.dataset.v;render()},
  hide:()=>{S.hide=!S.hide;render()},
  gshut:t=>{S.shut[t.dataset.g]=!S.shut[t.dataset.g];render()},
  stat:t=>{S.stat=t.dataset.v;S.openCat='';render()},
  cat:t=>{S.openCat=S.openCat===t.dataset.c?'':t.dataset.c;render()},
  ftype:t=>{syncF();F.t=t.dataset.v;F.c='';F.s='';drawAdd()},
  fcat:t=>{syncF();F.c=t.dataset.c;F.s='';drawAdd()},
  fsub:t=>{syncF();F.s=F.s===t.dataset.s?'':t.dataset.s;drawAdd()},
  fsave:t=>{syncF();const ns=$('#f-newsub');if(ns&&ns.value.trim())F.s=ns.value.trim();saveRec(!!t.dataset.again)},
  fdel:t=>{if(t.dataset.sure){deleteRec();return}t.dataset.sure='1';t.textContent='再按一次確認刪除'},
  settings:()=>openSettings(),
  logout:()=>{sb&&sb.auth.signOut().then(()=>location.reload())},
  acc:t=>openAcc(t.dataset.n,t.dataset.g),
  gadd:()=>{const i=$('#g-new'),n=i.value.trim();if(!n)return;const gs=S.settings.groups=S.settings.groups||[];if(gs.includes(n)||n==='不再使用'){toast('已經有這個分組');return}gs.push(n);commitSettings();openSettings();render()},
  gdel:t=>{const n=t.dataset.g;if(S.settings.accounts.some(a=>grpOf(a)===n)){toast('分組裡還有項目，請先移走');return}S.settings.groups=S.settings.groups.filter(x=>x!==n);commitSettings();openSettings();render()},
  accsave:()=>saveAcc(),
  allocset:()=>openAllocSet(),
  radd:()=>{syncAL();AL.ratios.push(['',0]);drawAlloc()},
  rdel:t=>{syncAL();AL.ratios.splice(+t.dataset.i,1);drawAlloc()},
  alsave:()=>saveAlloc(),
  expcsv:()=>download('記帳匯出.csv',toMozeCSV(S.months)),
  expjson:()=>download('記帳備份.json',JSON.stringify({v:1,settings:S.settings,months:S.months})),
  doimp:t=>doImport(t),
  rtoggle:t=>{const it=S.settings.recurring.find(x=>x.id===t.dataset.id);if(it){it.on=!it.on;if(it.on)it.from=it.from||monthOf(nowDate());commitSettings();openSettings()}},
  rdelx:t=>{S.settings.recurring=S.settings.recurring.filter(x=>x.id!==t.dataset.id);commitSettings();openSettings()},
  radd2:()=>{
    const n=$('#rc-n').value.trim(),a=parseFloat($('#rc-a').value.replace(/,/g,'')),day=Math.min(31,Math.max(1,parseInt($('#rc-d').value)||1));
    if(!n||!isFinite(a)||a<=0){toast('請填名稱和金額');return}
    const t=$('#rc-t').value,c=$('#rc-c').value;
    S.settings.recurring.push({id:uid(),n,t,a,c,s:$('#rc-s').value.trim(),ac:$('#rc-ac').value,day,from:monthOf(nowDate()),on:true});
    commitSettings();ensureRecurring();render();openSettings();toast('已新增，會從本月開始自動入帳');
  },
  addcat:t=>{const k=t.dataset.k,i=document.querySelector(`[data-newcat="${k}"]`),n=i.value.trim();if(!n)return;if(!S.settings.cats[k][n])S.settings.cats[k][n]=[];commitSettings();openSettings()}
};
function findDate(id){for(const m in S.months)if(S.months[m].some(r=>r.id===id))return m+'-01';return S.month+'-01'}
function syncF(){if(!F)return;const g=id=>document.getElementById(id);
  if(g('f-a'))F.a=g('f-a').value;if(g('f-ac'))F.ac=g('f-ac').value;if(g('f-to'))F.to=g('f-to').value;
  if(g('f-d'))F.d=g('f-d').value;if(g('f-n'))F.n=g('f-n').value;if(g('f-p'))F.p=g('f-p').value}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACTS[t.dataset.act];if(f)f(t,e)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;render();return}
  if(F&&t.id==='f-a'){F.a=t.value}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='imp'&&t.files[0])onImport(t.files[0]);
  if(t.id==='rest'&&t.files[0])t.files[0].text().then(tx=>{try{
    const o=JSON.parse(tx);if(!o.months||!o.settings)throw 0;
    
    S.settings=Object.assign(DEFAULTS(),o.settings);S.months=o.months;commitSettings();Object.keys(o.months).forEach(commitMonth);render();toast('已還原備份')}catch(x){toast('備份檔格式不正確')}});
  if(t.dataset.gren!==undefined){const o=t.dataset.gren,n=t.value.trim();if(!n||n===o||groupList().includes(n)){t.value=o;return}const gs=S.settings.groups;const i=gs.indexOf(o);if(i>=0)gs[i]=n;S.settings.accounts.forEach(a=>{if(grpOf(a)===o)a.g=n});if(S.shut[o]){S.shut[n]=S.shut[o]}commitSettings();render();return}
  if(t.dataset.bud!==undefined){const v=parseFloat(t.value.replace(/,/g,''));if(v>0)S.settings.budgets[t.dataset.bud]=v;else delete S.settings.budgets[t.dataset.bud];commitSettings();render()}
  if(t.id==='baseov'){const v=t.value.replace(/,/g,'').trim();if(v===''||!isFinite(+v))delete S.settings.baseOverride[S.month];else S.settings.baseOverride[S.month]=+v;commitSettings();render()}
  if(t.dataset.bill!==undefined){const m=S.month,b=S.settings.bills[m]||(S.settings.bills[m]={}),o=b[t.dataset.bill]||(b[t.dataset.bill]={});const v=t.value.replace(/,/g,'').trim();o.amt=v===''?null:+v;commitSettings();render()}
  if(t.dataset.paid!==undefined){const m=S.month,b=S.settings.bills[m]||(S.settings.bills[m]={}),o=b[t.dataset.paid]||(b[t.dataset.paid]={});o.paid=t.checked;commitSettings();render()}
  if(t.dataset.map!==undefined||t.dataset.rn!==undefined||t.dataset.rp!==undefined){if(AL){syncAL();if(t.dataset.rp!==undefined||t.dataset.rn!==undefined)drawAlloc()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetHost').innerHTML)closeSheet()});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==S.view){S.view=v;render()}});
{const v=location.hash.slice(1);if(VIEWS[v])S.view=v}
render();
initStore();
</script>
</body></html>
